[project]
name = "metawing"
version = "0.1.0"
description = "Flask backend for MetaWing YOLO26 butterfly prediction"
requires-python = ">=3.10,<3.12"
dependencies = [
  "flask>=3.0,<4.0",
  "pillow>=10.0,<10.4",
  "ultralytics>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
